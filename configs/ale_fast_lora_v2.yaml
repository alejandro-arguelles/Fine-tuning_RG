user: Ale
run_name: v2
seed: 0
model_name: Qwen/Qwen3-0.6B-Base

method: lora

lora:
  r: 4
  alpha: 8
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]
  layers:
    mode: all

data:
  max_train_examples: 2000
  max_seq_length: 512

training:
  output_dir: submissions/ale_v2
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  logging_steps: 10
  bf16: true

eval:
  limit: 200
  batch_size: 16
