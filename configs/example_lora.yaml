# Example LoRA fine-tuning config.
# Run with: python -m src.train --config configs/example_lora.yaml

user: example
seed: 0
model_name: Qwen/Qwen3-0.6B-Base

arithmetic:
  ops: mul  # mul | addsub
  min_digits: 2  # digits per operand in train
  max_digits: 5
  test_min_digits: 2  # digits per operand in test (6 = beyond the training range)
  test_max_digits: 6
  n_train: 200
  n_test: 50

method: lora  # lora | qlora | full | partial

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  layers:
    mode: all  # all | first_n | last_n | indices
    # n: 4          # used when mode is first_n or last_n
    # indices: []   # used when mode is indices, e.g. [0, 1, 26, 27]

data:
  max_train_examples: null
  max_seq_length: 640

training:
  output_dir: submissions/example_lora
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  logging_steps: 10
  bf16: true

eval:
  limit: null
  batch_size: 50
  temperature: 0  # 0 = greedy
  max_new_tokens: 512
