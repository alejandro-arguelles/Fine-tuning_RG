# Example LoRA fine-tuning config.
# Run with: python -m src.train --config configs/example_lora.yaml

team: example
seed: 0
model_name: Qwen/Qwen3-0.6B-Base

method: lora  # lora | qlora | full | partial

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]

data:
  max_train_examples: null  # null = use the full GSM8K train split (7473 examples)
  max_seq_length: 512

training:
  output_dir: submissions/example_lora
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  logging_steps: 10
  bf16: true

eval:
  limit: null  # null = evaluate on the full GSM8K test split (1319 examples)
  batch_size: 16
