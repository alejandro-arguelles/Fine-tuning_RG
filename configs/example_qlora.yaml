# Example QLoRA (4-bit base model + LoRA adapters) fine-tuning config.
# Run with: python -m src.train --config configs/example_qlora.yaml

team: example
seed: 0
model_name: Qwen/Qwen3-0.6B-Base

method: qlora  # lora | qlora | full | partial

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  layers:
    mode: last_n  # all | first_n | last_n | indices
    n: 8

data:
  max_train_examples: null
  max_seq_length: 512

training:
  output_dir: submissions/example_qlora
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  logging_steps: 10
  bf16: true

eval:
  limit: null
  batch_size: 16
