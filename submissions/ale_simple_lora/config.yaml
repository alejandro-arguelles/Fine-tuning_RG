team: Ale
run_name: Simple LoRA
seed: 0
model_name: Qwen/Qwen3-0.6B-Base

method: lora

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  layers:
    mode: all

data:
  max_train_examples: 200
  max_seq_length: 512

training:
  output_dir: submissions/ale_simple_lora
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  logging_steps: 10
  bf16: true

eval:
  limit: 200
  batch_size: 16
