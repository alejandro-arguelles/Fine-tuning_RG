# Example LoRA fine-tuning config.
# Run with: python -m src.train --config configs/example_lora.yaml

team: example
seed: 0
model_name: Qwen/Qwen3-0.6B-Base

method: lora  # lora | qlora | full | partial

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: ["q_proj", "v_proj"]
  layers:
    mode: all  # all | first_n | last_n | indices
    # n: 4          # used when mode is first_n or last_n
    # indices: []   # used when mode is indices, e.g. [0, 1, 26, 27]

data:
  max_train_examples: 200  # small subset, so this example runs fast as a demo
  max_seq_length: 512

training:
  output_dir: submissions/example_lora
  num_train_epochs: 3
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-4
  logging_steps: 10
  bf16: true

eval:
  limit: 200  # small subset for a quick demo; a real submission should use the full test split (null)
  batch_size: 16
